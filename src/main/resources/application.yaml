spring:
  application:
    name: lenv-api
  datasource:
    url: jdbc:h2:mem:lenvdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"

logging:
  level:
    com.lenv: DEBUG
